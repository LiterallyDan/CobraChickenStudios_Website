<!DOCTYPE html>
<html lang="en">
  <head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Contact — Cobra Chicken Studios</title>
	<link rel="stylesheet" href="/styles.css" />
	<link rel="icon" type="image/png" href="/Images/CobraChickenIcon.png" />
  </head>
  <body>
	<header class="site-header">
	  <div class="container header-row">
		<a href="/home" class="brand">
		  <div class="logo"></div>
		  <div>
			<h1>Cobra Chicken Studios</h1>
		  </div>
		</a>
		<nav class="main-nav">
		  <a href="/home">Home</a>
		  <a href="/updates">Updates</a>
		  <a href="/projects">Projects</a>
		  <a href="/about">About</a>
		  <a href="/contact">Contact</a>
		</nav>
	  </div>
	</header>

	<main>
	  <section class="contact">
		<div class="container contact-grid">
		  <div class="info-panel">
			<h2>Contact</h2>
			<p class="muted"> Questions, comments, collaborations — reach out.</p>
			<p><strong>Email:</strong> <a href="mailto:contact@cobrachickenstudio.ca">contact@cobrachickenstudio.ca</a></p>
			<p><strong>Socials:</strong></p>
			<ul class="socials">
			  <li><a href="https://twitter.com/" target="_blank" rel="noopener"><img src="/Icons/image.png" alt="Twitter" class="social-icon"></a></li>
			  <li><a href="https://youtube.com/" target="_blank" rel="noopener"><img src="/Icons/image.png" alt="YouTube" class="social-icon"></a></li>
			  <li><a href="https://instagram.com/" target="_blank" rel="noopener"><img src="/Icons/image.png" alt="Instagram" class="social-icon"></a></li>
			</ul>
		  </div>

		  <div class="info-panel">
			<h3>Mailing list</h3>
			<p class="muted">Join for release notes and dev updates.</p>
			<form id="mailForm">
				<input id="email" type="email" placeholder="you@example.com" required=""></input>
			  <button type="submit">Join</button>
			</form>
			<p id="mailStatus" class="muted" aria-live="polite"></p>
		  </div>
		</div>
	  </section>
	</main>

	<footer class="site-footer">
	  <div class="container">
		<p>© 2026 Cobra Chicken Studios.</p>
	  </div>
	</footer>

	<script src="/script.js"></script>
  </body>
</html>
