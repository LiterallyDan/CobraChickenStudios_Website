<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Cobra Chicken Studios</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-row">
        <div class="brand">
          <div class="logo"></div>
          <div>
            <h1>Cobra Chicken Studios</h1>
          </div>
        </div>
        <nav class="main-nav">
          <a href="index.html">Home</a>
          <a href="projects.html">Updates</a>
          <a href="games.html">Games</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="contact">
        <div class="container contact-grid">
          <div>
            <h2>Contact</h2>
            <p class="muted">Questions, press, or collabs — reach out.</p>
            <p><strong>Email:</strong> <a href="mailto:cobrachickenstudio@gmail.com">cobrachickenstudio@gmail.com</a></p>
            <p><strong>Socials:</strong></p>
            <ul class="socials">
              <li><a href="https://twitter.com/" target="_blank" rel="noopener">Twitter</a></li>
              <li><a href="https://youtube.com/" target="_blank" rel="noopener">YouTube</a></li>
              <li><a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a></li>
            </ul>
          </div>

          <div>
            <h3>Mailing list</h3>
            <p class="muted">Join for release notes and dev updates.</p>
            <form id="mailForm">
              <input id="email" type="email" placeholder="you@example.com" required>
              <button type="submit">Join</button>
            </form>
            <p id="mailStatus" class="muted" aria-live="polite"></p>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 Cobra Chicken Studios.</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
